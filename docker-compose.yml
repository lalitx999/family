services:
  postgres:
    image: postgres:16-alpine
    container_name: family_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-family_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-family_password}
      POSTGRES_DB: ${POSTGRES_DB:-family_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-family_user} -d ${POSTGRES_DB:-family_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: family_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8017:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-family_user}:${POSTGRES_PASSWORD:-family_password}@postgres:5432/${POSTGRES_DB:-family_db}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-family_user}:${POSTGRES_PASSWORD:-family_password}@postgres:5432/${POSTGRES_DB:-family_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family_celery_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-family_user}:${POSTGRES_PASSWORD:-family_password}@postgres:5432/${POSTGRES_DB:-family_db}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-family_user}:${POSTGRES_PASSWORD:-family_password}@postgres:5432/${POSTGRES_DB:-family_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family_celery_beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-family_user}:${POSTGRES_PASSWORD:-family_password}@postgres:5432/${POSTGRES_DB:-family_db}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-family_user}:${POSTGRES_PASSWORD:-family_password}@postgres:5432/${POSTGRES_DB:-family_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
